name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - name: Install dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile
    - name: Run Biome lint
      working-directory: frontend
      run: pnpm lint
    - name: Check for forbidden console.log in src/
      run: "ALLOWLIST=\"frontend/src/app/api/rpc/route.ts\"\necho \"Checking frontend/src\
        \ for console.log calls (allowlisted: $ALLOWLIST)...\"\nMATCHES=$(grep -rnE\
        \ \"console\\.log\\s*\\(\" frontend/src | grep -v \"^${ALLOWLIST}:\" || true)\n\
        if [ -n \"$MATCHES\" ]; then\n  echo \"::error::Found forbidden console.log\
        \ statements in frontend/src:\"\n  echo \"$MATCHES\"\n  exit 1\nfi\necho \"\
        Clean: No forbidden console.log found.\"\n"
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - name: Install dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile
    - name: Build Next.js app
      working-directory: frontend
      run: pnpm build
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - name: Install dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile
    - name: Run unit tests
      working-directory: frontend
      run: pnpm test
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - name: Install dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile
    - name: Run Biome lint
      working-directory: frontend
      run: pnpm lint
    - name: Scan tracked files for committed RELAYER_SECRET and secret seeds
      run: "echo \"Scanning tracked files for committed Stellar secret seeds...\"\n\
        MATCHES=$(git grep -En 'RELAYER_SECRET=S[A-Z0-9]{55}|\\bS[A-Z2-7]{55}\\b'\
        \ || true)\nif [ -n \"$MATCHES\" ]; then\n  echo \"::error::Found committed\
        \ Stellar secret seed in tracked files:\"\n  echo \"$MATCHES\"\n  exit 1\n\
        fi\necho \"Clean: No committed secret keys found in tracked files.\"\n"
  docs-drift:
    name: docs-drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Verify README contract addresses match config.ts
      run: "node --input-type=module -e '\nimport { readFileSync } from \"node:fs\"\
        ;\nconst config = readFileSync(\"frontend/src/lib/stellar/config.ts\", \"\
        utf8\");\nconst addresses = [...config.matchAll(/\"([CG][A-Z2-7]{55})\"/g)].map((match)\
        \ => match[1]);\nif (addresses.length !== 6) {\n  console.error(\"Expected\
        \ 6 CONTRACTS addresses in config.ts, found \" + addresses.length);\n  process.exit(1);\n\
        }\nconst readme = readFileSync(\"README.md\", \"utf8\");\nconst missing =\
        \ addresses.filter((address) => !readme.includes(address));\nif (missing.length\
        \ > 0) {\n  console.error(\"README.md is missing CONTRACTS addresses: \" +\
        \ missing.join(\", \"));\n  process.exit(1);\n}\nconsole.log(\"README.md lists\
        \ all \" + addresses.length + \" CONTRACTS addresses.\");\n'\n"
  headers:
    name: headers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: 10
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 20
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - name: Install dependencies
      timeout-minutes: 10
      run: pnpm install --frozen-lockfile
    - name: Build, start and verify the cross-origin headers
      timeout-minutes: 15
      run: "pnpm build\npnpm start > /tmp/next-start.log 2>&1 &\nserver_pid=$!\ntrap\
        \ 'kill \"$server_pid\" 2>/dev/null || true' EXIT\n\nready=\"\"\nfor attempt\
        \ in $(seq 1 60); do\n  if curl -sf -o /dev/null http://localhost:3000/; then\n\
        \    ready=\"yes\"\n    break\n  fi\n  sleep 1\ndone\nif [ -z \"$ready\" ];\
        \ then\n  echo \"next start did not become ready\"\n  cat /tmp/next-start.log\n\
        \  exit 1\nfi\n\nroot_headers=$(curl -sSI http://localhost:3000/)\nprintf\
        \ '%s\\n' \"$root_headers\"\nprintf '%s\\n' \"$root_headers\" | grep -qi 'cross-origin-opener-policy:\
        \ same-origin'\nprintf '%s\\n' \"$root_headers\" | grep -qi 'cross-origin-embedder-policy:\
        \ require-corp'\n\nengine_headers=$(curl -sSI http://localhost:3000/engine/js/web.js)\n\
        printf '%s\\n' \"$engine_headers\"\nprintf '%s\\n' \"$engine_headers\" | grep\
        \ -qi 'cache-control: no-store'\n\necho \"COOP/COEP and the /engine no-store\
        \ header are intact.\"\n"
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
    - lint
    - build
    - test
    - secret-scan
    - docs-drift
    - headers
    steps:
    - name: Verify every required job succeeded
      run: "results=\"${{ join(needs.*.result, ',') }}\"\necho \"Job results: ${results}\"\
        \ncase \",${results},\" in\n  *failure*|*cancelled*|*skipped*)\n    echo \"\
        At least one required job did not succeed.\"\n    exit 1\n    ;;\n  *success*)\n\
        \    ;;\n  *)\n    echo \"No job results were reported.\"\n    exit 1\n  \
        \  ;;\nesac\necho \"All required jobs succeeded.\"\n"
